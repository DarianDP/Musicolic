<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/albums.css">
    <link rel="stylesheet" href="/css/reviewPanel.css">

    <script src="/script/home.js" defer></script>
    <script src="/script/releaseButton.js" defer></script>
    <script src="/script/Search.js" defer></script>
    <script src="/script/search2.js" defer></script>
    <script src="/script/materia.js" defer></script>
        <script src="/script/puente.js" defer></script>
    <script src="/script/materia-send.js" defer></script>
    <script src="/script/materia-get.js" defer></script>
    <script src="/script/user-navigarion.js" defer></script>

    <title>Reviews</title>
</head>
<body>

       <div class="header">

    
        <a href="/html/home.html" class="logo-link" aria-label="Musicolic home">
            <img src="/css/img/Orbiting_Music_Emblem-removebg-preview.png" alt="Logo" id="logo-img">
        </a>

        <input type="text" placeholder="Search Music" id="Buscador" >

        <div class="music-menu">
            <button class="head musiquitapa" type="button" aria-expanded="false" aria-controls="music-options">
                Music
            </button>
            <div class="music-options" id="music-options" hidden>
                <a href="/html/Creator-top.html" class="music-menu-options">
                    
                    <h5>📌 Creator top 10</h5> 
                </a>

                <a href="/html/Top10Albums.html" class="music-menu-options" id="mieldayesemargin">
                    
                    <h5>💿 Top 10 albums</h5>
                </a>

                <a href="/html/Top10Artists.html" class="music-menu-options">
                
                    <h5>🎤 Top 10 artists</h5>
                </a>

                <a href="/html/HotNewRelease.html" class="music-menu-options">
                
                    <h5>🎶 Hot new releases</h5>
                </a>
                



            </div>
        </div>
        <a href="/html/reviews.html" class="head">Reviews</a>
        <a href="/html/List.html" class="head">Lists</a>

        
        
        <div class="user-navigation">

            <!-- boton de anadir -->
            <a class="add-content" title="Add Content" id="Add-contenidopa">
                <img src="/css/img/create.png" alt="Add Content" class="add-content-image">
               
                
            </a>

            <div class="backdrop"></div>
            <div class="create-rating" hidden>
                
                    <div></div>
                    <h2 class="create-rating-text">Create a Rating</h2>
                    <button class="cancel-button">X</button>
                
            </div>
            <div class="divisor-create" hidden></div>
             <div class="add-content-windows" hidden>

                <input type="text" class="add-search" id="seach-add" placeholder="Search Music...">
                

             </div>

             <div class="add-search-background" hidden >
                <div class="albums-rate">
                    <h2>Albums</h2>
                    <a href="" id="add-albums-pago3" hidden>Add New Albums</a>
                </div>
             </div>
             <!-- boton de anadir -->
            



            <a class="add-content" title="Chats" id="Comment-margindemierda">
                <img src="/css/img/coment.png" alt="Add Content" class="add-content-image">
            </a>
            <a class="add-content" title="Notifications">
                <img src="/css/img/campana.png" alt="Add Content" class="add-content-image">
            </a>

            <button class="User-profile-login" >
                <img src="https://www.pngall.com/wp-content/uploads/5/Profile-PNG-Clipart.png" alt="" class="User-profile-login-photo">
            </button>
        </div>
            
    
    </div>

    <div class="album-colum">
        <div class="album-row">
            <img src="" alt="" id="album-panel">
            
            <div class="album-block">
            <h2 id="album-nombre"></h2>

            
        <div class="album-data-panel">
            <h4>Album ●</h4>
            <h4 id="date-album"></h4>
            <h4> ●</h4>
            <h4 id="tracks-cuantity"></h4>
         </div>

         <div class="artist-colum">
            <img src="/css/img/profile4.jpeg" alt="" id="artist-imagen">
            <h3 id="artist-nombre"> NSQK</h3>
         </div>

         </div>


        </div>
    </div>
    <div class="division"></div>

    <div>
        <div class="review-section">
            <img src="" alt="" id="profile-panel">
            
            <div class="pruebita">
            <div class="nombresito">
                <h4>Review by</h4>
                <h4 id="username"></h4>
            </div>

            <div class="calification">
                <fieldset id="rating-star">
                    <input type="radio" name="rating" id="star5" value="5" required>
                    <label for="star5">★</label>

                     <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4">★</label> 

                     <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3">★</label>

                     <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2">★</label>

                     <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1">★</label>
                    <button id="delete-stars" type="button">X</button>
                </fieldset>

            </div>

            <div class="actual-review">
                <h2 id="title-papa"></h2>
                <p id="review-conenido"></p>
            </div>

            </div>

            

        </div>
    </div>
</body>
</html>
